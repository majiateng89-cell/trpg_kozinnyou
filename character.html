<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>キャラクターシート</title>

  <link rel="stylesheet" href="css/character.css">
  <script type="module" src="js/character.js" defer></script>
</head>

<body>
  <header>
    <h1>キャラクターシート</h1>

    <nav>
      <a href="index.html">ダイスロールへ戻る</a>
    </nav>
  </header>

  <main>
    <!-- 基本情報 -->
    <section>
      <h2>基本情報</h2>

      <div class="form-grid">
        <label>
          キャラクター名
          <input type="text" id="characterName" placeholder="例：探索者A">
        </label>

        <label>
          プレイヤー名
          <input type="text" id="playerName" placeholder="プレイヤー名">
        </label>

        <label>
  年齢
  <input
    type="number"
    id="age"
    min="15"
    max="90"
    placeholder="年齢を入力"
  >
</label>

        <div class="form-group">
  <label for="age">年齢</label>
  <input
    type="number"
    id="age"
    min="15"
    max="89"
    placeholder="15～89"
  >
</div>

<p id="ageAdjustmentMessage"></p>

<button type="button" id="applyAgeAdjustmentButton">
  年齢補正を適用
</button>

        <label>
          性別
          <input type="text" id="gender">
        </label>

       <label>
  職業
  <select id="occupation">
    <option value="">職業を選択してください</option>

    <option value="探偵">探偵</option>
    <option value="医師">医師</option>
    <option value="警察官">警察官</option>
    <option value="ジャーナリスト">ジャーナリスト</option>
    <option value="大学教授">大学教授</option>
    <option value="エンジニア">エンジニア</option>
    <option value="学生">学生</option>
    <option value="作家">作家</option>

    <!-- 追加職業 -->
    <option value="教師">教師</option>
    <option value="看護師">看護師</option>
    <option value="弁護士">弁護士</option>
    <option value="消防士">消防士</option>
    <option value="軍人">軍人</option>
    <option value="ジャーナリスト助手">ジャーナリスト助手</option>
    <option value="写真家">写真家</option>
    <option value="芸術家">芸術家</option>
    <option value="ミュージシャン">ミュージシャン</option>
    <option value="俳優">俳優</option>
    <option value="スポーツ選手">スポーツ選手</option>
    <option value="料理人">料理人</option>
    <option value="農家">農家</option>
    <option value="運転手">運転手</option>
    <option value="パイロット">パイロット</option>
    <option value="プログラマー">プログラマー</option>
    <option value="研究者">研究者</option>
    <option value="大学生">大学生</option>
    <option value="記者">記者</option>
    <option value="営業職">営業職</option>
    <option value="会社員">会社員</option>
    <option value="店員">店員</option>
    <option value="警備員">警備員</option>
    <option value="探検家">探検家</option>
    <option value="考古学者">考古学者</option>
    <option value="司書">司書</option>
    <option value="宗教家">宗教家</option>
    <option value="犯罪者">犯罪者</option>
    <option value="私立探偵">私立探偵</option>
    <option value="無職">無職</option>
  </select>
</label>

        <label>
          出身
          <input type="text" id="birthplace">
        </label>
      </div>
    </section>

    <div id="ageAdjustmentMessage"></div>

    <!-- 能力値 -->
    <section>
      <h2>能力値</h2>

      <div class="form-grid ability-grid">
        <label>
          STR
          <input type="number" id="STR" min="0" max="100" value="50">
        </label>

        <label>
          CON
          <input type="number" id="CON" min="0" max="100" value="50">
        </label>

        <label>
          POW
          <input type="number" id="POW" min="0" max="100" value="50">
        </label>

        <label>
          DEX
          <input type="number" id="DEX" min="0" max="100" value="50">
        </label>

        <label>
          APP
          <input type="number" id="APP" min="0" max="100" value="50">
        </label>

        <label>
          SIZ
          <input type="number" id="SIZ" min="0" max="100" value="50">
        </label>

        <label>
          INT
          <input type="number" id="INT" min="0" max="100" value="50">
        </label>

        <label>
          EDU
          <input type="number" id="EDU" min="0" max="100" value="50">
        </label>
      </div>
    </section>

    <!-- 追加情報 -->
    <section>
      <h2>追加情報</h2>

      <div class="form-grid">
        <label>
          耐久力
          <input type="number" id="hp" min="0" value="10">
        </label>

        <label>
          正気度
          <input type="number" id="san" min="0" value="50">
        </label>

        <label>
          マジック・ポイント
          <input type="number" id="mp" min="0" value="10">
        </label>

        <label>
          幸運
          <input type="number" id="luck" min="0" value="50">
        </label>
      </div>
    </section>

    <!-- 技能値 -->
    <section>
      <h2>技能値</h2>

      <div id="skillList"></div>

      <button id="addSkillButton" type="button">
        技能を追加
      </button>
    </section>

    <!-- メモ -->
    <section>
      <h2>メモ</h2>

      <textarea id="notes" rows="6"
        placeholder="人物設定、所持品、背景など"></textarea>
    </section>

    <!-- 操作 -->
    <section class="actions">
      <button id="saveButton" type="button">
        キャラクターを保存
      </button>

      <button id="loadButton" type="button">
        保存データを読み込む
      </button>

      <button id="clearButton" type="button">
        入力をクリア
      </button>
    </section>

    <p id="message"></p>

    <!-- 保存済みキャラクター -->
    <section>
      <h2>保存済みキャラクター</h2>
      <div id="characterList"></div>
    </section>
  </main>
</body>
</html>
